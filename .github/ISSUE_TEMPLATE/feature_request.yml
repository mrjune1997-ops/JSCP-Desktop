name: 功能建议
description: 提出新模块、新能力或交互改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看看 README 的功能模块表，避免和已有能力重复。

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 科学计算
        - 汇率换算
        - 外贸计算
        - 单位换算 / 百分比
        - 时差时钟
        - 界面 / 主题 / 缩放
        - 全新模块
        - 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现在的不便
      description: 描述当前卡在哪一步，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 决定版本号怎么走
      options:
        - 小功能补充（第三位 +1，如 v1.0.2）
        - 新模块 / 大板块（第二位 +1，如 v1.1.0）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 有参考软件、截图或计算公式的可贴在这里
